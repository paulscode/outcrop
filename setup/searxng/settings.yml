# SearXNG for the console's chat (setup/install-web.sh puts this in /etc/outcrop-searxng with a fresh secret).
# Local only (127.0.0.1:8888), so no rate limiter; JSON results for the console.
use_default_settings:
  engines:
    remove:              # Tor-only engines: they fail to load here and fill the log
      - ahmia
      - torch
general:
  instance_name: "outcrop search"
  enable_metrics: false
server:
  secret_key: "@SECRET@"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json
outgoing:
  request_timeout: 3.0
  max_request_timeout: 8.0
ui:
  query_in_title: false
